<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Platzhalterbild: Gartengestaltung">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe8dc"/>
      <stop offset="100%" stop-color="#c3d4bd"/>
    </linearGradient>
    <pattern id="stripes1" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <rect width="20" height="40" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <rect width="800" height="600" fill="url(#stripes1)"/>
  <g fill="#2f5d34" opacity="0.55">
    <circle cx="400" cy="240" r="60"/>
    <rect x="385" y="260" width="30" height="90" rx="6"/>
  </g>
  <text x="400" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#2f5d34" font-weight="700">Gartengestaltung</text>
  <text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#4b6b47">Platzhalterbild – reales Projektfoto folgt</text>
</svg>
